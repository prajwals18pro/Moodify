<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moodify 🎧</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cfd8dc;
            margin-bottom: 35px;
            font-size: 17px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            margin-bottom: 18px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        button {
            border: none;
            padding: 14px 20px;
            border-radius: 30px;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid rgba(255,255,255,0.2);
        }

        button:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.25);
        }

        button.selected {
            background: white;
            color: #141e30;
            transform: scale(1.05);
        }

        .find-btn {
            margin-top: 10px;
            padding: 16px 35px;
            font-size: 18px;
            font-weight: bold;
            background: white;
            color: #141e30;
        }

        .result {
            display: none;
            margin-top: 35px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
        }

        .result h2 {
            margin-bottom: 15px;
        }

        #selection {
            line-height: 1.8;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 34px;
            }

            .logo {
                font-size: 45px;
            }

            button {
                font-size: 14px;
                padding: 12px 16px;
            }
        }
        .theme-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    padding: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    font-size: 22px;
    z-index: 1000;
}

body.light-mode {
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    color: #111;
}

body.light-mode .subtitle {
    color: #333;
}

body.light-mode button {
    background: rgba(0,0,0,0.08);
    color: #111;
}

body.light-mode button.selected,
body.light-mode .find-btn {
    background: #111;
    color: white;
}
     .song-card {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 14px 0;
    padding: 16px;
    border-radius: 18px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    transition: 0.3s;
    text-align: left;
}

.song-card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,0.16);
}

.song-number {
    font-size: 18px;
    font-weight: bold;
    opacity: 0.6;
    min-width: 30px;
}

.song-info {
    flex: 1;
}

.song-info h3 {
    margin-bottom: 5px;
}

.song-info p {
    color: #cfd8dc;
    font-size: 14px;
}

.listen-btn,
.favorite-btn {
    width: 45px;
    height: 45px;
    padding: 0;
    border-radius: 50%;
    flex-shrink: 0;
}

.listen-btn {
    background: white;
    color: #141e30;
}

.favorite-btn {
    font-size: 22px;
}

.favorite-btn.liked {
    background: #ff4b6e;
    color: white;
}   
        footer {
    margin-top: 50px;
    padding: 25px 10px;
    text-align: center;
    opacity: 0.85;
}

footer h3 {
    font-size: 22px;
    margin-bottom: 8px;
}

footer p {
    margin: 5px 0;
    font-size: 14px;
}

footer .copyright {
    margin-top: 15px;
    font-size: 12px;
    opacity: 0.7;
}
        body.mood-happy {
    background: linear-gradient(135deg, #ff9966, #ff5e62);
}

body.mood-sad {
    background: linear-gradient(135deg, #141e30, #243b55);
}

body.mood-love {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
}

body.mood-attitude {
    background: linear-gradient(135deg, #200122, #6f0000);
}

body.mood-chill {
    background: linear-gradient(135deg, #654ea3, #eaafc8);
}

body.mood-energetic {
    background: linear-gradient(135deg, #f7971e, #ffd200);
}

body.mood-emotional {
    background: linear-gradient(135deg, #232526, #414345);
}
    </style>
</head>

<body>
    
<button class="theme-btn" onclick="toggleTheme()">🌙</button>
    
<div class="container">

    <div class="logo">🎧</div>

    <h1>MOODIFY</h1>

    <p class="subtitle">
        Your Mood. Your Language. Your Music.
    </p>


    <!-- LANGUAGE -->

    <div class="section">

        <h2>🌐 Choose Your Language</h2>

        <div class="options">

            <button class="language-btn"
                    onclick="selectLanguage(this)">
                🇮🇳 Kannada
            </button>

            <button class="language-btn"
                    onclick="selectLanguage(this)">
                🇮🇳 Hindi
            </button>

            <button class="language-btn"
                    onclick="selectLanguage(this)">
                🇮🇳 Tamil
            </button>

            <button class="language-btn"
                    onclick="selectLanguage(this)">
                🇮🇳 Telugu
            </button>

            <button class="language-btn"
                    onclick="selectLanguage(this)">
                🇮🇳 Malayalam
            </button>

            <button class="language-btn"
                    onclick="selectLanguage(this)">
                🇬🇧 English
            </button>

        </div>

    </div>


    <!-- MOOD -->

    <div class="section">

        <h2>💭 Choose Your Mood</h2>

        <div class="options">

            <button class="mood-btn"
                    onclick="selectMood(this)">
                😎 Happy
            </button>

            <button class="mood-btn"
                    onclick="selectMood(this)">
                😢 Sad
            </button>

            <button class="mood-btn"
                    onclick="selectMood(this)">
                ❤️ Love
            </button>

            <button class="mood-btn"
                    onclick="selectMood(this)">
                🔥 Attitude
            </button>

            <button class="mood-btn"
                    onclick="selectMood(this)">
                😴 Chill
            </button>

            <button class="mood-btn"
                    onclick="selectMood(this)">
                ⚡ Energetic
            </button>

            <button class="mood-btn"
                    onclick="selectMood(this)">
                🥺 Emotional
            </button>

        </div>

    </div>


    <!-- FIND MUSIC -->

    <button class="find-btn"
            onclick="findMusic()">

        🎵 FIND MY MUSIC

    </button>


    <!-- RESULT -->

    <div class="result" id="result">

        <h2>🎶 Your Music Is Ready!</h2>

        <p id="selection"></p>

    </div>

</div>


<!-- CONNECT JAVASCRIPT -->

<script src="script.js"></script>

</body>
</html>
