<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodify 🎧</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cfd8dc;
            margin-bottom: 35px;
            font-size: 17px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            margin-bottom: 18px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        button {
            border: none;
            padding: 14px 20px;
            border-radius: 30px;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid rgba(255,255,255,0.2);
        }

        button:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.25);
        }

        button.selected {
            background: #ffffff;
            color: #141e30;
            transform: scale(1.05);
        }

        .find-btn {
            margin-top: 10px;
            padding: 16px 35px;
            font-size: 18px;
            font-weight: bold;
            background: white;
            color: #141e30;
        }

        .result {
            display: none;
            margin-top: 35px;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
        }

        .result h2 {
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 34px;
            }

            .logo {
                font-size: 40px;
            }

            button {
                font-size: 14px;
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🎧</div>

    <h1>MOODIFY</h1>

    <p class="subtitle">
        Your Mood. Your Language. Your Music.
    </p>

    <div class="section">
        <h2>🌐 Choose Your Language</h2>

            <button onclick="selectLanguage(this)">🇮🇳 Kannada</button>
            <button onclick="selectLanguage(this)">🇮🇳 Hindi</button>
