<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moodify 2.0</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <div>
                <h1>🎵 Moodify</h1>
                <p>Your mood. Your language. Your music.</p>
            </div>

            <button id="themeBtn" class="theme-btn">🌙</button>
        </header>


        <!-- LANGUAGE -->
        <section class="selection-section">

            <h2>🌍 Choose Language</h2>

            <div class="language-grid">

                <button class="language-btn active"
                        data-language="Kannada">
                    ಕನ್ನಡ
                </button>

                <button class="language-btn"
                        data-language="Hindi">
                    हिंदी
                </button>

                <button class="language-btn"
                        data-language="Tamil">
                    தமிழ்
                </button>

                <button class="language-btn"
                        data-language="Telugu">
                    తెలుగు
                </button>

                <button class="language-btn"
                        data-language="English">
                    English
                </button>

            </div>

        </section>


        <!-- MOOD -->
        <section class="selection-section">

            <h2>💭 Choose Your Mood</h2>

            <div class="mood-grid">

                <button class="mood-btn active"
                        data-mood="Happy">
                    😊 Happy
                </button>

                <button class="mood-btn"
                        data-mood="Sad">
                    😔 Sad
                </button>

                <button class="mood-btn"
                        data-mood="Romantic">
                    ❤️ Romantic
                </button>

                <button class="mood-btn"
                        data-mood="Energetic">
                    ⚡ Energetic
                </button>

                <button class="mood-btn"
                        data-mood="Calm">
                    🌿 Calm
                </button>

                <button class="mood-btn"
                        data-mood="Motivational">
                    🔥 Motivational
                </button>

                <button class="mood-btn"
                        data-mood="Chill">
                    😎 Chill
                </button>

            </div>

        </section>


        <!-- FIND MUSIC -->
        <button id="findMusicBtn" class="find-btn">
            🎧 FIND MY MUSIC
        </button>


        <!-- RESULT HEADER -->
        <section class="result-header">

            <div>
                <p class="small-title">YOUR PERSONAL PLAYLIST</p>

                <h2 id="resultTitle">
                    Kannada • Happy
                </h2>
            </div>

            <div class="song-count">
                <span id="songCount">100</span>
                <small>Songs</small>
            </div>

        </section>


        <!-- SONGS -->
        <main id="songsContainer" class="songs-container">

            <!-- Songs will be generated by script.js -->

        </main>


        <!-- FAVORITES -->
        <section class="favorites-section">

            <div class="section-heading">
                <div>
                    <p class="small-title">YOUR COLLECTION</p>
                    <h2>❤️ Favorites</h2>
                </div>

                <span id="favoriteCount">0</span>
            </div>

            <div id="favoritesContainer"
                 class="favorites-container">

                <p class="empty-message">
                    ❤️ Your favorite songs will appear here.
                </p>

            </div>

        </section>


        <!-- FOOTER -->
        <footer>

            <p>Made with ❤️ by Prajwal</p>

            <p class="footer-small">
                Moodify 2.0 • Music for every mood
            </p>

        </footer>

    </div>


    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
